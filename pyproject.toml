[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haxs"
version = "0.8.8"
description = "Hole-Aware XXZ Squeezing surrogate pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyyaml",
  "matplotlib",
  "pytest"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
