    contourpy: "==1.2.0"
    cycler: "==0.11.0"
    fonttools: "==4.51.0"
    iniconfig: "==1.1.1"
    kiwisolver: "==1.4.8"
    packaging: "==24.1"
    pillow: "==10.4.0"
    pluggy: "==1.6.0"
    pyparsing: "==3.1.2"
    python-dateutil: "==2.9.0.post0"
